name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          tools: composer:v2, phpstan:2.3.4
          coverage: none

      - name: Validar composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Convención - strict_types en todo el PHP
        run: |
          missing=$(grep -rL 'declare(strict_types=1);' backend --include='*.php' --exclude-dir=vendor || true)
          if [ -n "$missing" ]; then
            echo "Archivos sin declare(strict_types=1):"
            echo "$missing"
            exit 1
          fi

      - name: Análisis estático (PHPStan, nivel 8)
        run: phpstan analyse -c phpstan.neon --no-progress

      - name: Pruebas
        run: php backend/tests/run.php

      - name: Dependencias PHP (SCA)
        working-directory: backend
        run: |
          if php -r 'exit(count(json_decode(file_get_contents("composer.lock"), true)["packages"]) > 0 ? 0 : 1);'; then
            composer audit --locked
          else
            echo "Sin dependencias de terceros en PHP: no hay nada que auditar."
          fi

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (sin scripts de instalación)
        run: npm ci --ignore-scripts

      - name: Pruebas
        run: npm test

      - name: Compilación (TypeScript estricto + Vite)
        run: npm run build

      - name: Dependencias de producción (SCA, severidad alta)
        run: npm audit --omit=dev --audit-level=high

      - name: Todas las dependencias (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install --no-input semgrep==1.183.0

      - name: Probar las reglas propias
        run: semgrep --test --metrics=off semgrep-rules

      - name: Reglas propias del proyecto (bloqueante)
        run: semgrep scan --config semgrep-rules --error --metrics=off backend frontend/src

      - name: Reglas de la comunidad (informativo)
        continue-on-error: true
        run: |
          semgrep scan --metrics=off --error \
            --config p/php --config p/typescript --config p/react --config p/owasp-top-ten \
            --json --output semgrep-community.json backend frontend/src

      - name: Informe de la comunidad
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-community
          path: semgrep-community.json
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (checksum verificado)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Buscar secretos en todo el historial
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  iac:
    name: IaC, Kubernetes, SIEM y workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Checkov
        run: pip install --no-input checkov==3.4.0

      - name: Checkov (Dockerfiles y GitHub Actions)
        run: checkov --config-file .checkov.yaml

      - name: Instalar kustomize y kubeconform (checksum verificado)
        run: |
          curl -sSfL -o kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz"
          echo "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61  kustomize.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz kustomize
          curl -sSfL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform

      - name: Kubernetes - esquema (kubeconform) y seguridad (Checkov)
        run: |
          ./kustomize build deploy/k8s --load-restrictor LoadRestrictionsNone > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml deploy/k8s/job-migrate.yaml
          checkov -f rendered.yaml -f deploy/k8s/job-migrate.yaml --framework kubernetes --skip-download --compact --quiet

      - name: Reglas del SIEM (Wazuh) contra logs reales
        run: python3 scripts/check_wazuh_rules.py

      - name: Instalar actionlint (checksum verificado)
        run: |
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint

      - name: Validar los workflows
        run: ./actionlint -color
