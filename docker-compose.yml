# Redes segmentadas (Capa 4: red interna): la BD solo es alcanzable desde la API.
services:
  # Entrada pública: WAF (ModSecurity + OWASP CRS) delante de la SPA y la API.
  waf:
    image: owasp/modsecurity-crs:nginx # fijar a una etiqueta versionada (4.x.y-nginx-<fecha>) al validar
    ports: ["8080:8080"]
    environment:
      BACKEND: http://web:8080
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"            # "DetectionOnly" para afinar sin bloquear
      BLOCKING_PARANOIA: "1"              # subir a 2 tras revisar falsos positivos
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"   # la API usa PUT, PATCH y DELETE
    volumes:
      - ./ops/waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    depends_on:
      web: { condition: service_healthy }
    networks: [edge]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/nginx/Dockerfile }
    expose: ["8080"]                       # solo accesible desde el WAF
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  app:
    build: { context: ., dockerfile: docker/php/Dockerfile, target: app }
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:?definir DB_NAME}
      MARIADB_USER: ${DB_USER:?definir DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?definir DB_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
    networks: [data]            # sin puertos publicados al host
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  edge: {}
  data: { internal: true }      # sin salida a Internet

volumes:
  dbdata: {}
