# Exclusiones de OWASP CRS específicas de NovaTech.
# Se montan en /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf (ver docker-compose.yml).
# Criterio: cada exclusión es lo más estrecha posible (ruta + campo + familia de reglas) y está justificada.
# Las demás tasas de falsos positivos se atienden aquí, nunca bajando el nivel de paranoia de forma global.

# Contraseñas (login y registro).
# Una contraseña legítima puede contener comillas, <, >, ; o "--" y las familias de inyección la confunden con un ataque.
# Es seguro excluir SOLO el campo password de esas familias: nunca se concatena en SQL (consultas preparadas) ni se
# muestra en HTML (solo se compara con Argon2id). El resto de campos de esas rutas siguen inspeccionados.
SecRule REQUEST_URI "@rx ^/api/auth/(?:login|register)$" \
    "id:1000010,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=attack-generic;ARGS:json.password"
