apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Imagen oficial fijada por versión; en producción se fija por digest con la sección images de kustomize."
    checkov.io/skip2: "CKV_K8S_40=UID nativo de la imagen oficial; el aislamiento lo aportan runAsNonRoot, seccomp RuntimeDefault, drop ALL y sin escalada de privilegios."
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
    spec:
      serviceAccountName: novatech
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb:11
          imagePullPolicy: Always
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom: { configMapKeyRef: { name: novatech-config, key: DB_NAME } }
            - name: MARIADB_USER
              valueFrom: { configMapKeyRef: { name: novatech-config, key: DB_USER } }
            - { name: MARIADB_PASSWORD_FILE, value: /etc/novatech/secrets/DB_PASSWORD }
            - { name: MARIADB_ROOT_PASSWORD_FILE, value: /etc/novatech/secrets/DB_ROOT_PASSWORD }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: run, mountPath: /run/mysqld }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /etc/novatech/secrets, readOnly: true }
      volumes:
        - name: secrets
          secret:
            secretName: novatech-secrets
            defaultMode: 0440
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
