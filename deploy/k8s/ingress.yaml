apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novatech
  annotations:
    # Ajustar según el Ingress Controller instalado. El tráfico siempre pasa por el WAF.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx   # ajustar a la IngressClass del clúster
  tls:
    - hosts: [novatech.example.com]
      secretName: novatech-tls   # kubectl create secret tls novatech-tls --cert=... --key=...
  rules:
    - host: novatech.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: waf
                port:
                  number: 8080
