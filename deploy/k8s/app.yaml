apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: fastcgi
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    checkov.io/skip1: "CKV_K8S_43=La imagen se construye localmente y se referencia por etiqueta; en producción se fija por digest con la sección images de kustomize."
    checkov.io/skip2: "CKV_K8S_40=UID nativo de la imagen oficial; el aislamiento lo aportan runAsNonRoot, seccomp RuntimeDefault, drop ALL y sin escalada de privilegios."
    checkov.io/skip3: "CKV_K8S_15=Imagen local cargada en el clúster (kind); en producción se usa un registro con imagePullPolicy Always."
spec:
  # Una réplica: la sesión y el límite de tasa usan archivos locales. Para escalar horizontalmente hay que
  # implementar Session y RateLimitStore sobre Redis (las interfaces ya existen; ver docs/OPERATIONS.md).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      serviceAccountName: novatech
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82   # www-data en php:8.3-fpm-alpine
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: php-fpm
          image: novatech-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: fastcgi
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: novatech-config
          env:
            - { name: DB_PASSWORD_FILE, value: /etc/novatech/secrets/DB_PASSWORD }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: fastcgi }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: fastcgi }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /etc/novatech/secrets, readOnly: true }
      volumes:
        - name: secrets
          secret:
            secretName: novatech-secrets
            defaultMode: 0440
            items:
              - { key: DB_PASSWORD, path: DB_PASSWORD }
        - name: tmp
          emptyDir: {}
