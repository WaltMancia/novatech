apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: novatech

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - db.yaml
  - app.yaml
  - web.yaml
  - waf.yaml
  - networkpolicy.yaml
  - ingress.yaml

# Única fuente de verdad de las exclusiones del WAF: la misma que usa docker-compose.
configMapGenerator:
  - name: waf-exclusions
    files:
      - REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf=../../ops/waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf

# En producción: sustituir por el registro propio y fijar por digest, p. ej.
#   - name: novatech-app
#     newName: ghcr.io/<owner>/novatech-app
#     digest: sha256:...
images:
  - name: novatech-app
    newTag: local
  - name: novatech-web
    newTag: local

labels:
  - pairs:
      app.kubernetes.io/part-of: novatech
