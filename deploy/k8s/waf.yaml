apiVersion: v1
kind: Service
metadata:
  name: waf
spec:
  selector:
    app.kubernetes.io/name: waf
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  annotations:
    checkov.io/skip1: "CKV_K8S_22=La imagen oficial de OWASP CRS requiere un sistema de archivos escribible (no publica variante de solo lectura)."
    checkov.io/skip2: "CKV_K8S_43=Imagen oficial fijada por etiqueta; en producción se fija por digest con la sección images de kustomize."
    checkov.io/skip3: "CKV_K8S_40=UID nativo de la imagen oficial; el aislamiento lo aportan runAsNonRoot, seccomp RuntimeDefault, drop ALL y sin escalada de privilegios."
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: waf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waf
    spec:
      serviceAccountName: novatech
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # usuario nginx de la imagen
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: modsecurity-crs
          image: owasp/modsecurity-crs:nginx
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: BACKEND, value: "http://web:8080" }
            - { name: PORT, value: "8080" }
            - { name: MODSEC_RULE_ENGINE, value: "On" }
            - { name: BLOCKING_PARANOIA, value: "1" }
            - { name: ANOMALY_INBOUND, value: "5" }
            - { name: ANOMALY_OUTBOUND, value: "4" }
            - { name: ALLOWED_METHODS, value: "GET HEAD POST OPTIONS PUT PATCH DELETE" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: exclusions
              mountPath: /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
              subPath: REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
              readOnly: true
      volumes:
        - name: exclusions
          configMap:
            name: waf-exclusions
