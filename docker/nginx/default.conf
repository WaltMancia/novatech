# Solo confiar en X-Forwarded-Proto cuando haya un proxy/CDN de confianza delante (p. ej. Cloudflare).
map $http_x_forwarded_proto $fwd_https {
    default "";
    https   "on";
}

server {
    listen 8080;

    # El WAF es el único proxy delante de este servidor (no se publica): se confía en su cabecera X-Real-IP
    # para que el rate limit, el RASP y los logs vean la IP real del cliente y no la del contenedor del WAF.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    location /api/ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $fwd_https if_not_empty;
        fastcgi_read_timeout 15s;
    }

    location /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
