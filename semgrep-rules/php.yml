rules:
  - id: novatech-php-sql-interpolation
    languages: [php]
    severity: ERROR
    message: >-
      SQL construido con interpolación de variables. Usa parámetros enlazados (?). Si el fragmento es una constante
      o proviene de una lista blanca, documenta la excepción en la línea con
      `// nosemgrep: novatech-php-sql-interpolation` y explica el motivo.
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: $DB->$FN("...{$X}...", ...)
          - pattern: $DB->$FN("...$X...", ...)
          - pattern: $DB->$FN($A . $X . $B, ...)
          - pattern: $DB->$FN($A . "...{$X}...", ...)
      - metavariable-regex:
          metavariable: $FN
          regex: ^(fetchAll|fetchOne|execute|query|exec|prepare)$

  - id: novatech-php-dangerous-function
    languages: [php]
    severity: ERROR
    message: Función peligrosa (ejecución de código o de comandos). Está prohibida en este proyecto.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: shell_exec(...)
      - pattern: system(...)
      - pattern: passthru(...)
      - pattern: proc_open(...)
      - pattern: popen(...)
      - pattern: unserialize(...)
      - pattern: extract(...)

  - id: novatech-php-weak-hash
    languages: [php]
    severity: WARNING
    message: md5/sha1 no son aptos para contraseñas, tokens ni firmas. Usa PasswordHasher (Argon2id) o hash('sha256', ...).
    metadata:
      category: security
      cwe: "CWE-328: Use of Weak Hash"
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)

  - id: novatech-php-weak-random
    languages: [php]
    severity: WARNING
    message: rand/mt_rand/uniqid no son criptográficamente seguros. Usa random_bytes() o random_int().
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak PRNG"
    pattern-either:
      - pattern: rand(...)
      - pattern: mt_rand(...)
      - pattern: uniqid(...)

  - id: novatech-php-superglobal-input
    languages: [php]
    severity: ERROR
    message: >-
      Acceso directo a superglobales de entrada. Toda entrada pasa por Core\Request y luego por Validator.
    paths:
      exclude:
        - "**/src/Core/Request.php"
        - "**/tests/**"
    metadata:
      category: architecture
    pattern-either:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_FILES

  - id: novatech-php-cors-wildcard
    languages: [php]
    severity: ERROR
    message: CORS abierto a cualquier origen. La SPA usa el mismo origen; no hace falta y expone la API.
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy"
    pattern: 'header("Access-Control-Allow-Origin: *", ...)'

  - id: novatech-php-password-algorithm
    languages: [php]
    severity: ERROR
    message: Las contraseñas se hashean solo con Argon2id mediante Services\PasswordHasher.
    paths:
      exclude:
        - "**/tests/**"
    patterns:
      - pattern: password_hash(...)
      - pattern-not: password_hash($P, PASSWORD_ARGON2ID, ...)
    metadata:
      category: security
      cwe: "CWE-916: Password Hash With Insufficient Computational Effort"
